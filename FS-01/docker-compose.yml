version: '3.8'

services:
  # Next.js Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncspace_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://syncspace:syncspace_secret@postgres:5432/syncspace?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=syncspace_production_secret_32chars_long!!
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_COLLAB_WS_URL=ws://localhost:1234
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Real-Time WebSocket Collaboration Server (Yjs + Express + Redis)
  collab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncspace_collab
    restart: unless-stopped
    command: ["npx", "tsx", "collaboration-server/server.ts", "1234"]
    ports:
      - "1234:1234"
    environment:
      - NODE_ENV=production
      - COLLAB_PORT=1234
      - COLLAB_HOST=0.0.0.0
      - DATABASE_URL=postgresql://syncspace:syncspace_secret@postgres:5432/syncspace?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: syncspace_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: syncspace
      POSTGRES_PASSWORD: syncspace_secret
      POSTGRES_DB: syncspace
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Distributed Pub/Sub & Awareness Scaling
  redis:
    image: redis:7-alpine
    container_name: syncspace_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
